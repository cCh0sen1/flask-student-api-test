services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    environment:
      MYSQL_ROOT_PASSWORD: king
      MYSQL_DATABASE: test_db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  flask:
    build: .
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: king
      DB_NAME: test_db
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5000), 2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  test:
    build: .
    command: ["pytest", "-v"]
    environment:
      BASE_URL: http://flask:5000
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: king
      DB_NAME: test_db
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      flask:
        condition: service_healthy
