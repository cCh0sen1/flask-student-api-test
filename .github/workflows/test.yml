name: Python API Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:
  test:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: king
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pking"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Init database
        run: |
          mysql -h 127.0.0.1 -uroot -pking test_db < sql/init.sql


      - name: Start Flask server
        run: |
          python server/app.py &
          sleep 5


      - name: Run pytest
        run: |
          pytest